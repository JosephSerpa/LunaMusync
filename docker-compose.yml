name: luna-musync

services:
  navidrome:
    image: deluan/navidrome:0.58.0
    restart: unless-stopped
    environment:
      ND_MUSICFOLDER: /music
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_ENABLESHARING: "false"
    volumes:
      - navidrome-data:/data
    ports:
      - "127.0.0.1:${NAVIDROME_PORT:-4533}:4533"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4533/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  luna:
    image: ${LUNA_IMAGE:-ghcr.io/josephserpa/luna-musync:latest}
    restart: unless-stopped
    init: true
    environment:
      NAVIDROME_URL: http://navidrome:4533
      NAVIDROME_PUBLIC_URL: ${NAVIDROME_PUBLIC_URL:-http://localhost:4533}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEB_DIST: /app/web
    ports:
      - "${LUNA_BIND:-127.0.0.1}:${LUNA_PORT:-3001}:3001"
    volumes:
      - luna-data:/data
    depends_on:
      navidrome:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  navidrome-data:
  luna-data:
