name: Publicar release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar tipos, pruebas y compilación
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Preparar Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Compilar aplicación Android de administración
        working-directory: apps/android-admin
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Preparar APK de administración
        run: cp apps/android-admin/app/build/outputs/apk/debug/app-debug.apk "luna-admin-${GITHUB_REF_NAME}-debug.apk"
      - name: Preparar nombre de imagen
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/luna-musync" >> "$GITHUB_ENV"
      - name: Autenticar GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar imagen
        id: image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          build-args: LUNA_VERSION=${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
      - name: Certificar procedencia de la imagen
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Preparar archivos de actualización
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ github.ref_name }}
        run: |
          node -e 'const fs = require("node:fs"); const crypto = require("node:crypto"); const image = `ghcr.io/${process.env.GITHUB_REPOSITORY_OWNER.toLowerCase()}/luna-musync@${process.env.DIGEST}`; const composeSha256 = crypto.createHash("sha256").update(fs.readFileSync("docker-compose.yml")).digest("hex"); fs.writeFileSync("luna-release.json", JSON.stringify({ version: process.env.VERSION, image, composeSha256 }, null, 2) + "\n");'
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=*.tsbuildinfo --exclude=.env --exclude=.luna-test --exclude=backups -czf "$RUNNER_TEMP/luna-musync-$VERSION.tar.gz" .
          mv "$RUNNER_TEMP/luna-musync-$VERSION.tar.gz" .
      - name: Publicar release e instalador
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          generate_release_notes: true
          files: |
            luna-release.json
            docker-compose.yml
            luna-musync-${{ github.ref_name }}.tar.gz
            luna-admin-${{ github.ref_name }}-debug.apk
