name: Comprobaciones

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@1e60f620b9541dca16e99b0ab2ac68f68c746d # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar tipos
        run: npm run typecheck
      - name: Ejecutar pruebas
        run: npm test
      - name: Compilar aplicación
        run: npm run build
      - name: Construir imagen Docker
        run: docker build --tag luna-musync:ci .
